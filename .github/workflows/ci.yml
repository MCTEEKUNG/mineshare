name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  workspace:
    name: workspace / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Native dependencies differ between Ubuntu 22.04 and 24.04.
          # runner.os alone is just Linux and lets incompatible targets collide.
          key: ${{ matrix.os }}
          workspaces: ". -> target"

      - name: Linux deps for mDNS / Tauri later
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libasound2-dev libudev-dev libopus-dev cmake

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: Linux installer lifecycle tests
        if: runner.os == 'Linux'
        run: |
          node installer/linux/build-deb-hooks.mjs
          bash -n ui/src-tauri/target/deb-hooks/preinst ui/src-tauri/target/deb-hooks/postinst installer/linux/deb-prerm
          bash installer/linux/test-deb-lifecycle.sh
          node installer/linux/test-gnome-pointer.mjs
          bash installer/linux/test-typeless-startup.sh
          sudo --preserve-env=GITHUB_ACTIONS bash installer/linux/test-deb-upgrade.sh

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-targets --locked

      - name: Private Wayland pointer bridge transport test
        if: runner.os == 'Linux'
        run: env -u DISPLAY -u WAYLAND_DISPLAY MINESHARE_TEST_PRIVATE_BUS=1 dbus-run-session -- cargo test -p mineshare-input private_bus_roundtrip_and_timeout --locked -- --ignored

  ui:
    name: ui (tauri) / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94

      - name: Cache cargo (tauri)
        uses: Swatinem/rust-cache@v2
        with:
          # Keep GTK/WebKit Rust artifacts isolated by Ubuntu release, including
          # fallback restores (rust-cache includes this key in its prefix).
          key: ${{ matrix.os }}
          workspaces: "ui/src-tauri -> target"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Linux deps for Tauri 2
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libasound2-dev \
            libudev-dev \
            libopus-dev \
            cmake \
            pkg-config \
            build-essential \
            file

      - name: npm install
        working-directory: ui
        run: npm ci

      - name: Frontend tests
        working-directory: ui
        run: npm test -- --run

      - name: Type-check + build frontend
        working-directory: ui
        run: npm run build

      - name: cargo check (tauri backend)
        working-directory: ui/src-tauri
        run: cargo check --all-targets --locked

      - name: Ubuntu setup backend tests
        if: runner.os == 'Linux'
        working-directory: ui/src-tauri
        run: |
          sudo apt-get install -y pkexec
          cargo test --lib linux_setup:: --locked
          bash ../../installer/linux/test-setup-flow.sh

      - name: Windows installer helper checks
        if: runner.os == 'Windows'
        run: |
          cargo fmt --manifest-path installer/windows/maintenance/Cargo.toml --check
          cargo clippy --manifest-path installer/windows/maintenance/Cargo.toml --locked -- -D warnings
          cargo test --manifest-path installer/windows/maintenance/Cargo.toml --locked
          powershell.exe -NoProfile -File installer/windows/test-process-stop.ps1
