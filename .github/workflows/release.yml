# Build distributable installers for Windows + Linux on every
# tag push (e.g. `git tag v0.1.0 && git push --tags`). Each
# matrix leg builds on its native OS — Tauri can't cross-compile
# because each platform's WebView is a native lib.
#
# Outputs land in a draft GitHub Release attached to the tag.
# Code-signing is intentionally not configured here; the README
# walks users through SmartScreen / GPG verification by hand.
# When a cert appears, drop the relevant signing inputs into
# `tauri-action`'s `with:` block — no other changes needed.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x64
          - os: windows-latest
            label: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libudev-dev \
            cmake \
            libasound2-dev \
            libpipewire-0.3-dev \
            libopus-dev \
            pulseaudio-utils \
            pkg-config \
            build-essential

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94
        with:
          targets: ${{ matrix.os == 'windows-latest' && 'x86_64-pc-windows-msvc' || 'x86_64-unknown-linux-gnu' }}

      - name: Cache Cargo + Tauri target dir
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
          workspaces: |
            .
            ui/src-tauri

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install JS deps
        working-directory: ui
        run: npm ci

      - name: Build installers
        working-directory: ui
        run: npm run tauri -- build --ci -- --locked

      - name: Build unified Windows EXE bootstrapper
        if: runner.os == 'Windows'
        run: node installer/windows/build-bootstrapper.mjs

      - name: Audit Windows MSI update support
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = Get-ChildItem ui/src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          ./installer/windows/test-msi-package.ps1 -MsiFile $msi.FullName

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          if [ "${{ matrix.os }}" = "ubuntu-22.04" ]; then
              cp ui/src-tauri/target/release/bundle/deb/*.deb artifacts/ 2>/dev/null || true
              cp ui/src-tauri/target/release/bundle/appimage/*.AppImage artifacts/ 2>/dev/null || true
              cp ui/src-tauri/target/release/bundle/rpm/*.rpm artifacts/ 2>/dev/null || true
          else
              cp ui/src-tauri/target/release/bundle/msi/*.msi artifacts/ 2>/dev/null || true
              cp ui/src-tauri/target/release/bundle/nsis/*-setup.exe artifacts/ 2>/dev/null || true
          fi
          ls -la artifacts/

      - name: Installer checksums
        shell: bash
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS-${{ matrix.label }}.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mineshare-${{ matrix.label }}
          path: artifacts/*
          if-no-files-found: error

  installer-acceptance:
    name: Windows upgrade / ${{ matrix.scenario }}
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        scenario: [msi-msi, msi-exe, exe-msi, exe-exe, script-msi, script-exe, programs-msi, programs-exe, fresh-msi, fresh-exe, rollback, rollback-nsis, downgrade, unified-msi, unified-exe]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mineshare-windows-x64
          path: new-installers
      - name: Real installation, upgrade, repeat-install and data/startup checks
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./installer/windows/test-upgrade.ps1 -NewDirectory (Resolve-Path new-installers).Path -Scenario '${{ matrix.scenario }}'
      - name: Keep installer failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-logs-${{ matrix.scenario }}
          path: ${{ runner.temp }}/msi-*.log

  stage-release:
    name: Stage draft only after installer acceptance
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, installer-acceptance]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mineshare-*
          merge-multiple: true
          path: installers
      - name: Never change assets of an already published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          existing=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$existing" = "false" ]; then
            echo "Release is already published; keeping its verified assets unchanged."
            exit 0
          fi
          if [ -z "$existing" ]; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --title "MineShare ${tag#v}" --generate-notes
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" installers/*
