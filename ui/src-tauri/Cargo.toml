# Opt out of the parent workspace — Tauri keeps its own lockfile and target dir.
[workspace]

[package]
name = "mineshare-app"
version = "0.0.10"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[lib]
name = "mineshare_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Enabled by `tauri build`; without it the WebView always loads
# from `devUrl` (http://localhost:1420) and shows
# "Could not connect to localhost: connection refused" when run
# outside `tauri dev`. Including it in the default feature set
# makes plain `cargo build --release` produce a binary that serves
# the embedded `frontendDist` instead.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# Single-instance guard: a second launch hands its argv to the
# already-running instance (which focuses its window) and exits,
# so the embedded daemon never double-spawns and fights itself
# over the same ports / mDNS name / input hooks.
tauri-plugin-single-instance = "2"

# Wire the workspace crates so the Tauri backend can drive the daemon
# directly. M5 rewires the GUI to embed the full daemon runtime
# (capture + audio + clipboard + control) instead of the M0
# discovery-only prototype, so the same binary serves as both the
# headless bridge and its UI.
mineshare-core   = { path = "../../crates/mineshare-core" }
mineshare-net    = { path = "../../crates/mineshare-net" }
mineshare-ipc    = { path = "../../crates/mineshare-ipc" }
mineshare-input  = { path = "../../crates/mineshare-input" }
mineshare-audio  = { path = "../../crates/mineshare-audio" }
mineshare-daemon = { path = "../../crates/mineshare-daemon" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1.43", features = ["rt-multi-thread", "sync", "macros", "net", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"

[patch.crates-io]
# Keep the standalone Tauri lock on the same upstream quick-xml advisory fix.
wayland-scanner = { git = "https://github.com/Smithay/wayland-rs", rev = "d07c4f91f28b42e5a485823ffd9d8d5a210b1053" }
