    </filter>
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#6D501B" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="52" y="52" width="920" height="920" rx="218" fill="url(#ivory)" filter="url(#tileShadow)"/>
  <rect x="61" y="61" width="902" height="902" rx="209" fill="none" stroke="#B68A2E" stroke-opacity="0.34" stroke-width="10"/>

