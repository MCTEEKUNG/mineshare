<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">MineShare Linked M</title>
  <desc id="desc">A geometric linked M in antique gold on an ivory marble tile.</desc>
  <defs>
    <linearGradient id="ivory" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.52" stop-color="#FBFAF7"/>
      <stop offset="1" stop-color="#F1ECE3"/>
    </linearGradient>
    <linearGradient id="gold" x1="0.12" y1="0.08" x2="0.9" y2="0.94">
      <stop offset="0" stop-color="#E4C968"/>
      <stop offset="0.34" stop-color="#B68A2E"/>
      <stop offset="0.68" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#8A651F"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
