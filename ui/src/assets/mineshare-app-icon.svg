<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">MineShare Linked M</title>
  <desc id="desc">A geometric linked M in sky blue on a black glass tile.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2129"/>
      <stop offset="1" stop-color="#0A0C0F"/>
    </linearGradient>
    <linearGradient id="blue" x1="0.12" y1="0.08" x2="0.9" y2="0.94">
      <stop offset="0" stop-color="#9AD0FF"/>
      <stop offset="0.5" stop-color="#4DA3FF"/>
      <stop offset="1" stop-color="#2A74D6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="22" flood-color="#4DA3FF" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="52" y="52" width="920" height="920" rx="218" fill="url(#tile)"/>
  <rect x="61" y="61" width="902" height="902" rx="209" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="10"/>
  <g filter="url(#glow)">
    <path d="M246 724V330L512 596L778 330V724" fill="none" stroke="url(#blue)" stroke-width="102" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M236 321L512 607L788 321" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.55"/>
  </g>
  <rect x="475" y="559" width="74" height="74" rx="16" transform="rotate(45 512 596)" fill="#FFFFFF" stroke="#2A74D6" stroke-width="8"/>
</svg>
